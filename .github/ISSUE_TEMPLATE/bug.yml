name: Bug
description: Report a bug in the trade signal platform
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What's broken? Include expected vs actual behavior.
      placeholder: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of the system is affected?
      options:
        - Dashboard (Angular)
        - API (NestJS)
        - Shared Types (libs/signals)
        - Full Stack
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is it?
      options:
        - Critical (app crashes or data loss)
        - High (feature broken, no workaround)
        - Medium (feature broken, workaround exists)
        - Low (cosmetic or minor)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Error messages, screenshots, logs.
      placeholder: Optional.
    validations:
      required: false
