name: Chore
description: Maintenance, cleanup, or infrastructure task
labels: ["chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: Chore Description
      description: What needs to be done and why?
      placeholder: Describe the task.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of the system does this affect?
      options:
        - Dashboard (Angular)
        - API (NestJS)
        - Shared Types (libs/signals)
        - Build / CI / Config
        - Full Stack
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Any other context.
      placeholder: Optional.
    validations:
      required: false
