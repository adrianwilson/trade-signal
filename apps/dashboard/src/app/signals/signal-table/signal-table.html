<h2>Trading Signals</h2>

<table mat-table [dataSource]="signals" class="signal-table">
  <ng-container matColumnDef="asset">
    <th mat-header-cell *matHeaderCellDef>Asset</th>
    <td mat-cell *matCellDef="let signal">{{ signal.asset }}</td>
  </ng-container>

  <ng-container matColumnDef="assetClass">
    <th mat-header-cell *matHeaderCellDef>Class</th>
    <td mat-cell *matCellDef="let signal">{{ signal.assetClass }}</td>
  </ng-container>

  <ng-container matColumnDef="direction">
    <th mat-header-cell *matHeaderCellDef>Direction</th>
    <td mat-cell *matCellDef="let signal">
      <mat-chip [style.background-color]="directionColor(signal.direction)"
                style="color: white">
        {{ signal.direction }}
      </mat-chip>
    </td>
  </ng-container>

  <ng-container matColumnDef="confidence">
    <th mat-header-cell *matHeaderCellDef>Confidence</th>
    <td mat-cell *matCellDef="let signal">{{ signal.confidence }}%</td>
  </ng-container>

  <ng-container matColumnDef="source">
    <th mat-header-cell *matHeaderCellDef>Source</th>
    <td mat-cell *matCellDef="let signal">{{ signal.source }}</td>
  </ng-container>

  <ng-container matColumnDef="timestamp">
    <th mat-header-cell *matHeaderCellDef>Time</th>
    <td mat-cell *matCellDef="let signal">{{ signal.timestamp | date:'short' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
