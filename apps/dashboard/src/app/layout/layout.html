<mat-toolbar color="primary">
  <mat-icon>show_chart</mat-icon>
  <span style="margin-left: 8px">Trade Signal</span>
  <span style="flex: 1"></span>
  @if (authService.isAuthenticated()) {
  <span class="user-email">{{ authService.user()?.email }}</span>
  <button mat-icon-button (click)="authService.logout()" aria-label="Logout">
    <mat-icon>logout</mat-icon>
  </button>
  } @else {
  <a mat-button routerLink="/login">Login</a>
  }
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/synthesis" routerLinkActive="active">
        <mat-icon matListItemIcon>hub</mat-icon>
        <span matListItemTitle>Synthesis</span>
      </a>
      <a mat-list-item routerLink="/watchlist" routerLinkActive="active">
        <mat-icon matListItemIcon>star</mat-icon>
        <span matListItemTitle>Watchlist</span>
      </a>
      <a mat-list-item routerLink="/signals" routerLinkActive="active">
        <mat-icon matListItemIcon>table_chart</mat-icon>
        <span matListItemTitle>Activity Log</span>
      </a>
      <a mat-list-item routerLink="/news" routerLinkActive="active">
        <mat-icon matListItemIcon>newspaper</mat-icon>
        <span matListItemTitle>News Sentiment</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
